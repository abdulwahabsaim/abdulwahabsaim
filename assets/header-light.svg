      @keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(5);opacity:0}}
      @media (prefers-reduced-motion:reduce){.pkt,.ring{animation:none}.pkt{opacity:0}.ring{opacity:0}}
    </style>

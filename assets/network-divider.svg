<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%" height="24" style="background: transparent;">
  <defs>
    <style>
      .div-line { stroke: #0284c7; stroke-width: 1.5; opacity: 0.35; stroke-dasharray: 6,4; }
      .div-line-solid { stroke: #0284c7; stroke-width: 1; opacity: 0.2; }
      .node-outer { fill: #ffffff; stroke: #0284c7; stroke-width: 1.5; }
      .node-core { fill: #ffffff; stroke: #0284c7; stroke-width: 2.5; }
      @media (prefers-color-scheme: dark) {
        .div-line { stroke: #00D2FF; opacity: 0.4; }
        .div-line-solid { stroke: #00D2FF; opacity: 0.25; }
        .node-outer { fill: #0d1117; stroke: #00D2FF; stroke-width: 1.5; }
        .node-core { fill: #0d1117; stroke: #00D2FF; stroke-width: 2.5; }
      }
    </style>
    <filter id="glow-div" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Continuous Fiber Baseline -->
  <line x1="20" y1="12" x2="980" y2="12" class="div-line-solid"/>
  <line x1="24" y1="12" x2="976" y2="12" class="div-line"/>

  <!-- Core Central Hub Pulse -->
  <circle cx="500" cy="12" r="14" fill="#00D2FF" opacity="0.08">
    <animate attributeName="r" values="8;16;8" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.01;0.1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Central Core Hub Node -->
  <circle cx="500" cy="12" r="6" class="node-core" filter="url(#glow-div)"/>
  <circle cx="500" cy="12" r="2.5" fill="#00FF88"/>

  <!-- Intermediate Distribution Transit Nodes -->
  <circle cx="260" cy="12" r="4.5" class="node-outer"/>
  <circle cx="260" cy="12" r="2" fill="#00D2FF"/>

  <circle cx="740" cy="12" r="4.5" class="node-outer"/>
  <circle cx="740" cy="12" r="2" fill="#00D2FF"/>

  <!-- Edge Termination Nodes -->
  <circle cx="20" cy="12" r="3.5" class="node-outer" opacity="0.7"/>
  <circle cx="20" cy="12" r="1.5" fill="#00D2FF"/>

  <circle cx="980" cy="12" r="3.5" class="node-outer" opacity="0.7"/>
  <circle cx="980" cy="12" r="1.5" fill="#00D2FF"/>

  <!-- Bi-Directional High-Speed Packet Stream -->
  <circle r="2.5" fill="#00FF88" filter="url(#glow-div)">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M20,12 L500,12"/>
  </circle>
  <circle r="2.5" fill="#00D2FF" filter="url(#glow-div)">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M500,12 L980,12" begin="0.7s"/>
  </circle>
  <circle r="2.2" fill="#00FF88">
    <animateMotion dur="3.0s" repeatCount="indefinite" path="M980,12 L500,12" begin="1.3s"/>
  </circle>
  <circle r="2.2" fill="#00D2FF">
    <animateMotion dur="3.0s" repeatCount="indefinite" path="M500,12 L20,12" begin="2.0s"/>
  </circle>
</svg>

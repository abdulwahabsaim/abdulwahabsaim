<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 20" width="100%" height="20" style="background: transparent;">
  <defs>
    <style>
      .div-line { stroke: #0284c7; stroke-width: 1; opacity: 0.25; stroke-dasharray: 4,4; }
      .div-circle-outer { fill: #ffffff; stroke: #0284c7; stroke-width: 1.5; }
      .div-circle-center { fill: #ffffff; stroke: #0284c7; stroke-width: 2; }
      @media (prefers-color-scheme: dark) {
        .div-line { stroke: #00D2FF; opacity: 0.3; }
        .div-circle-outer { fill: #0d1117; stroke: #00D2FF; stroke-width: 1.5; }
        .div-circle-center { fill: #0d1117; stroke: #00D2FF; stroke-width: 2; }
      }
    </style>
  </defs>

  <circle cx="20" cy="10" r="4" class="div-circle-outer" opacity="0.6"/>
  <circle cx="20" cy="10" r="1.8" fill="#00D2FF" opacity="0.8"/>
  <line x1="26" y1="10" x2="292" y2="10" class="div-line"/>
  
  <circle cx="300" cy="10" r="6" class="div-circle-center"/>
  <circle cx="300" cy="10" r="2.5" fill="#00FF88"/>
  
  <line x1="308" y1="10" x2="574" y2="10" class="div-line"/>
  <circle cx="580" cy="10" r="4" class="div-circle-outer" opacity="0.6"/>
  <circle cx="580" cy="10" r="1.8" fill="#00D2FF" opacity="0.8"/>

  <!-- Animated Streamers -->
  <circle r="2.2" fill="#00FF88" opacity="0.9">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M26,10 L292,10"/>
  </circle>
  <circle r="2.2" fill="#00D2FF" opacity="0.9">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M308,10 L574,10" begin="1.1s"/>
  </circle>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="img" aria-label="divider"><title>divider</title><style>
      .ln{stroke:#3d444d;stroke-width:1.5;stroke-dasharray:5 6}
      .nd{fill:#0d1117;stroke:#6e7681;stroke-width:1.5}

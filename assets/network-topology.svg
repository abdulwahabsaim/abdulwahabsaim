<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 130" width="100%" height="130" style="background: transparent;">
  <defs>
    <style>
      .link-line { stroke: #0284c7; opacity: 0.35; stroke-width: 1.5; }
      .link-dash { stroke: #0284c7; opacity: 0.25; stroke-width: 1; stroke-dasharray: 3,3; }
      .sub-link { stroke: #059669; opacity: 0.35; stroke-width: 1; }
      .node-bg-core { fill: #ffffff; stroke: #0284c7; stroke-width: 2.5; }
      .node-bg-dist { fill: #ffffff; stroke: #0284c7; stroke-width: 2; }
      .node-bg-sub { fill: #ffffff; stroke: #059669; stroke-width: 1.5; }
      .label-core { fill: #0284c7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 9px; font-weight: bold; }
      .label-sub { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 8px; font-weight: 500; }
      .label-green { fill: #059669; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-size: 7.5px; font-weight: 600; }

      @media (prefers-color-scheme: dark) {
        .link-line { stroke: #00D2FF; opacity: 0.35; stroke-width: 1.5; }
        .link-dash { stroke: #00D2FF; opacity: 0.25; stroke-width: 1; stroke-dasharray: 3,3; }
        .sub-link { stroke: #00FF88; opacity: 0.3; stroke-width: 1; }
        .node-bg-core { fill: #0d1117; stroke: #00D2FF; stroke-width: 2.5; }
        .node-bg-dist { fill: #0d1117; stroke: #00D2FF; stroke-width: 2; }
        .node-bg-sub { fill: #0d1117; stroke: #00FF88; stroke-width: 1.5; }
        .label-core { fill: #00D2FF; }
        .label-sub { fill: #8b949e; }
        .label-green { fill: #00FF88; }
      }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mesh Links -->
  <line x1="100" y1="35" x2="340" y2="65" class="link-line"/>
  <line x1="100" y1="95" x2="340" y2="65" class="link-line"/>
  <line x1="340" y1="65" x2="580" y2="35" class="link-line"/>
  <line x1="340" y1="65" x2="580" y2="95" class="link-line"/>
  <line x1="100" y1="35" x2="100" y2="95" class="link-dash"/>
  <line x1="580" y1="35" x2="580" y2="95" class="link-dash"/>
  <line x1="340" y1="65" x2="430" y2="12" class="sub-link"/>
  <line x1="340" y1="65" x2="430" y2="118" class="sub-link"/>
  <line x1="580" y1="35" x2="750" y2="65" class="link-line"/>
  <line x1="580" y1="95" x2="750" y2="65" class="link-line"/>

  <!-- Core Router Pulse -->
  <circle cx="340" cy="65" r="20" fill="#00D2FF" opacity="0.06">
    <animate attributeName="r" values="14;26;14" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.01;0.08" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Core Router Node -->
  <circle cx="340" cy="65" r="9" class="node-bg-core" filter="url(#glow)"/>
  <circle cx="340" cy="65" r="4" fill="#00FF88"/>
  <text x="340" y="89" class="label-core" text-anchor="middle" letter-spacing="0.5">CORE-RTR</text>

  <!-- Distribution Nodes -->
  <circle cx="100" cy="35" r="7" class="node-bg-dist"/>
  <circle cx="100" cy="35" r="3" fill="#00D2FF"/>
  <text x="100" y="22" class="label-sub" text-anchor="middle">DIST-01</text>

  <circle cx="100" cy="95" r="7" class="node-bg-dist"/>
  <circle cx="100" cy="95" r="3" fill="#00D2FF"/>
  <text x="100" y="114" class="label-sub" text-anchor="middle">DIST-02</text>

  <circle cx="580" cy="35" r="7" class="node-bg-dist"/>
  <circle cx="580" cy="35" r="3" fill="#00D2FF"/>
  <text x="580" y="22" class="label-sub" text-anchor="middle">SEC-GW1</text>

  <circle cx="580" cy="95" r="7" class="node-bg-dist"/>
  <circle cx="580" cy="95" r="3" fill="#00D2FF"/>
  <text x="580" y="114" class="label-sub" text-anchor="middle">SEC-GW2</text>

  <!-- Satellite Nodes -->
  <circle cx="430" cy="12" r="5" class="node-bg-sub"/>
  <circle cx="430" cy="12" r="2" fill="#00FF88"/>
  <text x="430" y="7" class="label-green" text-anchor="middle">DHCP/DNS</text>

  <circle cx="430" cy="118" r="5" class="node-bg-sub"/>
  <circle cx="430" cy="118" r="2" fill="#00FF88"/>
  <text x="430" y="128" class="label-green" text-anchor="middle">AAA/RADIUS</text>

  <circle cx="750" cy="65" r="8" class="node-bg-dist"/>
  <circle cx="750" cy="65" r="3.5" fill="#00D2FF"/>
  <text x="750" y="87" class="label-core" text-anchor="middle">EDGE-WAN</text>

  <!-- Animated Data Packets -->
  <circle r="3" fill="#00FF88" filter="url(#glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M100,35 L340,65"/>
  </circle>
  <circle r="3" fill="#00D2FF" filter="url(#glow)">
    <animateMotion dur="2.1s" repeatCount="indefinite" path="M100,95 L340,65" begin="0.8s"/>
  </circle>
  <circle r="3" fill="#00FF88" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M340,65 L580,35" begin="0.3s"/>
  </circle>
  <circle r="3" fill="#00D2FF" filter="url(#glow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M340,65 L580,95" begin="0.9s"/>
  </circle>
  <circle r="2.5" fill="#00FF88">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M340,65 L430,12" begin="0.2s"/>
  </circle>
  <circle r="2.5" fill="#00FF88">
    <animateMotion dur="1.7s" repeatCount="indefinite" path="M430,118 L340,65" begin="0.5s"/>
  </circle>
  <circle r="3" fill="#00D2FF" filter="url(#glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M580,35 L750,65" begin="0.6s"/>
  </circle>
  <circle r="3" fill="#00FF88" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M750,65 L580,95" begin="1.2s"/>
  </circle>
</svg>
